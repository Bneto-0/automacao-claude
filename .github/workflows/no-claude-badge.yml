name: Post without Claude badge

on:
  issue_comment:
    types: [created]
  push:
    branches:
      - 'data/**'

jobs:
  repost-comment:
    if: github.event_name == 'issue_comment' && github.event.comment.user.login == 'claude[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Repost comment and handle close tag
        env:
          GH_TOKEN: ${{ secrets.SEB_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          SHOULD_CLOSE=false
          if echo "$COMMENT_BODY" | grep -q '<!-- close -->'; then
            SHOULD_CLOSE=true
          fi

          CLEAN_BODY=$(echo "$COMMENT_BODY" | sed '/<!-- close -->/d' | sed '/Generated by Claude/d' | sed '/Co-Authored-By: Claude/d')

          gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$CLEAN_BODY"
          gh api -X DELETE "repos/$REPO/issues/comments/$COMMENT_ID"

          if [ "$SHOULD_CLOSE" = "true" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$REPO" || gh pr close "$ISSUE_NUMBER" --repo "$REPO"
          fi

  open-sync-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Open PR from data branch
        env:
          GH_TOKEN: ${{ secrets.SEB_GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" -eq 0 ]; then
            TITLE=$(git log -1 --pretty=%s)
            BODY=$(git log -1 --pretty=%b)
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "${BODY:-Automated update}"
          fi
